# Documentation-only scheduled analytics rule specification, not an importable ARM template.
name: Password spray from single source IP
description: Multiple failed Entra ID sign-ins across distinct users from one IP.
severity: Medium
mitre_tactics:
  - CredentialAccess
mitre_techniques:
  - T1110.003
query_file: password_spray.kql
query_frequency: PT1H
query_period: PT1H
trigger_operator: GreaterThan
trigger_threshold: 0
entity_mappings:
  - entity_type: IP
    identifier: Address
    column: IPAddress
suppression_enabled: false
status: example-only
